<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentTeam — 专家团配置工具</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1017;--surface:#161b22;--surface2:#1c2333;--surface3:#242d3d;
  --border:#2a3140;--border2:#353f52;
  --text:#e6edf3;--text2:#8b949e;--text3:#545d68;
  --accent:#58a6ff;--accent2:#388bfd;--accent-bg:rgba(88,166,255,.08);
  --green:#3fb950;--green-bg:rgba(63,185,80,.08);
  --yellow:#d29922;--yellow-bg:rgba(210,153,34,.08);
  --red:#f85149;--red-bg:rgba(248,81,73,.08);
  --purple:#bc8cff;--teal:#39d2c0;--orange:#f0883e;--blue:#58a6ff;
  --radius:8px;--radius-sm:5px;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',Roboto,sans-serif;
  --mono:'SF Mono',Monaco,'Cascadia Code',Consolas,monospace;
  --shadow:0 2px 8px rgba(0,0,0,.3);--transition:.15s ease;
}
html,body{height:100%;background:var(--bg);color:var(--text);font:13px/1.5 var(--font);overflow:hidden}
a{color:var(--accent);text-decoration:none}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--border2)}

/* Inputs */
input,select,textarea{font:inherit;color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);outline:none;transition:border-color var(--transition),box-shadow var(--transition)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(88,166,255,.15)}
input[type=text],input[type=number],textarea{padding:6px 10px;width:100%}
input[type=number]{width:90px}
input[type=color]{width:36px;height:32px;padding:2px;cursor:pointer;border-radius:var(--radius-sm)}
textarea{resize:vertical;min-height:120px;font-family:var(--mono);font-size:12px;line-height:1.5}
select{padding:5px 10px;appearance:auto;min-width:0}

/* Buttons */
button{cursor:pointer;padding:5px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text);font-size:12px;font-weight:500;transition:all var(--transition);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
button:hover{background:var(--surface3);border-color:var(--border2)}
button.primary{background:var(--accent2);color:#fff;border-color:var(--accent2)}
button.primary:hover{background:var(--accent);opacity:.9}
button.green{background:var(--green-bg);color:var(--green);border-color:rgba(63,185,80,.2)}
button.green:hover{background:rgba(63,185,80,.15)}
button.danger{color:var(--red);border-color:transparent;background:transparent}
button.danger:hover{background:var(--red-bg);border-color:rgba(248,81,73,.2)}
button.sm{padding:3px 10px;font-size:11px}
button.icon-btn{padding:4px 6px;border:none;background:transparent;color:var(--text3);font-size:15px;line-height:1}
button.icon-btn:hover{color:var(--text);background:var(--surface3)}

/* Layout */
.app{display:flex;flex-direction:column;height:100vh}

/* Team Bar */
.team-bar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.team-bar .brand{font-size:14px;font-weight:700;color:var(--accent);letter-spacing:-.3px;margin-right:8px;display:flex;align-items:center;gap:6px}
.team-bar .brand svg{width:18px;height:18px;fill:var(--accent)}
.team-bar select{min-width:150px;font-weight:500}
.team-bar .sep{width:1px;height:22px;background:var(--border);margin:0 2px;flex-shrink:0}
.team-bar .spacer{flex:1}
.team-bar .meta{font-size:11px;color:var(--text3)}

/* Main */
.main{display:flex;flex:1;overflow:hidden}

/* Left Panel */
.left-panel{width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.panel-header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.panel-header .title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text2)}
.panel-header .count{font-size:11px;color:var(--text3);font-weight:400}
.agent-list{flex:1;overflow-y:auto;padding:4px 6px}
.agent-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;transition:background var(--transition);margin-bottom:2px;border:1px solid transparent;position:relative}
.agent-item:hover{background:var(--surface2)}
.agent-item.active{background:var(--accent-bg);border-color:rgba(88,166,255,.2)}
.agent-item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;box-shadow:0 0 4px currentColor}
.agent-item .info{flex:1;min-width:0}
.agent-item .info .name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agent-item .info .role{font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agent-item .mode-badge{font-size:9px;padding:2px 5px;border-radius:3px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;flex-shrink:0}
.agent-item .mode-badge.sub{background:var(--surface3);color:var(--text3)}
.agent-item .mode-badge.pri{background:var(--green-bg);color:var(--green)}
.agent-item .del{position:absolute;right:4px;top:50%;transform:translateY(-50%);opacity:0;transition:opacity var(--transition)}
.agent-item:hover .del{opacity:1}

/* Center Panel */
.center-panel{flex:1;overflow-y:auto;padding:20px 24px;min-width:0}
.center-panel::-webkit-scrollbar-thumb{background:var(--surface3)}

/* Section */
.sec{margin-bottom:20px}
.sec-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.sec-head .sec-icon{font-size:14px;width:20px;text-align:center;color:var(--text3)}
.sec-head .sec-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text2)}
.form-row{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.form-row>label{font-size:12px;color:var(--text2);min-width:70px;text-align:right;flex-shrink:0}
.form-row>.flex-1{flex:1;min-width:0}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.form-group{display:flex;flex-direction:column;gap:3px}
.form-group label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.3px}
.form-group.full{grid-column:1/-1}
.color-row{display:flex;align-items:center;gap:8px}
.color-hex{font-family:var(--mono);font-size:12px;color:var(--text2)}

/* List items */
.list-item{display:flex;gap:4px;align-items:center;margin-bottom:4px}
.list-item input{flex:1}

/* Cards */
.card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px;transition:border-color var(--transition)}
.card:hover{border-color:var(--border2)}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.card-head .card-label{font-size:12px;font-weight:600;color:var(--accent)}
.card-head .card-sub{font-size:11px;color:var(--text3);margin-left:6px}
.card-grid{display:grid;grid-template-columns:70px 1fr;gap:4px 8px;align-items:center}
.card-grid label{font-size:11px;color:var(--text2);text-align:right}
.card-nested{margin-top:6px;padding-top:6px;border-top:1px solid var(--border)}
.card-nested .nested-label{font-size:10px;font-weight:600;text-transform:uppercase;color:var(--text3);letter-spacing:.4px;margin-bottom:4px}
.add-btn{display:flex;align-items:center;gap:4px;padding:6px 0;color:var(--text3);font-size:12px;cursor:pointer;border:none;background:none;width:100%}
.add-btn:hover{color:var(--accent)}

/* Right Panel */
.right-panel{width:340px;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.right-sec{padding:14px;border-bottom:1px solid var(--border)}
.right-sec:last-child{border-bottom:none;flex:1;display:flex;flex-direction:column;overflow:hidden}
.right-sec .sec-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.tools-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px}
.tool-chip{display:flex;align-items:center;gap:5px;padding:4px 6px;border-radius:var(--radius-sm);cursor:pointer;transition:background var(--transition);font-size:11px}
.tool-chip:hover{background:var(--surface3)}
.tool-chip input{accent-color:var(--accent);width:13px;height:13px;cursor:pointer}
.tool-chip .tool-name{font-family:var(--mono);font-size:10px;color:var(--text2)}
.perm-row{display:flex;align-items:center;justify-content:space-between;padding:3px 0}
.perm-row .perm-name{font-size:12px;color:var(--text)}
.perm-row select{width:76px;padding:3px 6px;font-size:12px}
.preview-box{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;font-family:var(--mono);font-size:11px;line-height:1.45;white-space:pre-wrap;word-break:break-all;flex:1;overflow-y:auto;color:var(--text2)}
.preview-box .json-key{color:#79c0ff}
.preview-box .json-str{color:#a5d6ff}
.preview-box .json-bool{color:#4ec9b0}
.preview-box .json-num{color:#b5cea8}
.preview-box .json-null{color:var(--text3)}

/* Bottom Bar */
.bottom-bar{padding:6px 16px;background:var(--surface);border-top:1px solid var(--border);font-size:11px;color:var(--text3);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.bottom-bar .dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:6px}
.bottom-bar .dot.ok{background:var(--green)}

/* Command Toast */
.cmd-toast{position:fixed;bottom:50px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);padding:12px 20px;font-family:var(--mono);font-size:13px;color:var(--text);box-shadow:var(--shadow);z-index:999;display:flex;align-items:center;gap:12px;animation:slideUp .25s ease}
.cmd-toast .cmd{color:var(--accent);font-weight:600}
.cmd-toast .copy-btn{font-size:11px;padding:4px 10px}
@keyframes slideUp{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* Toast */
.toast-wrap{position:fixed;top:12px;right:12px;z-index:9999;display:flex;flex-direction:column;gap:6px}
.toast{padding:8px 16px;border-radius:var(--radius-sm);background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:12px;animation:fadeDown .2s;box-shadow:var(--shadow)}
.toast.success{border-color:rgba(63,185,80,.3);color:var(--green)}
.toast.info{border-color:rgba(88,166,255,.3);color:var(--accent)}
.toast.error{border-color:rgba(248,81,73,.3);color:var(--red)}
@keyframes fadeDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

/* Empty State */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text3);text-align:center;padding:40px;gap:10px}
.empty .empty-icon{font-size:40px;opacity:.3}
.empty .empty-hint{font-size:13px;max-width:200px;line-height:1.6}
.empty .empty-btn{margin-top:8px}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;display:flex;align-items:center;justify-content:center;animation:fadeIn .15s}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;min-width:340px;max-width:500px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.modal h3{font-size:15px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.modal .modal-grid{display:grid;grid-template-columns:80px 1fr;gap:8px;align-items:center;margin-bottom:16px}
.modal .modal-grid label{font-size:12px;color:var(--text2);text-align:right}
.modal .modal-actions{display:flex;justify-content:flex-end;gap:8px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<div class="app">
  <div class="team-bar">
    <div class="brand">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      AgentTeam
    </div>
    <select id="teamSelect"></select>
    <button onclick="createTeam()">+ 新建</button>
    <button onclick="renameTeam()">重命名</button>
    <button onclick="deleteTeam()" class="danger">删除</button>
    <div class="sep"></div>
    <button onclick="loadPreset()">加载预设</button>
    <button onclick="importFile()">导入 JSON</button>
    <button onclick="exportFile()" class="green">导出 JSON</button>
    <div class="sep"></div>
    <button onclick="buildPlugin()" class="primary">构建插件</button>
    <button onclick="activateTeam()" class="green">激活团队</button>
    <div class="spacer"></div>
    <span class="meta" id="teamMeta"></span>
  </div>
  <input type="file" id="fileInput" accept=".json" style="display:none">

  <div class="main">
    <div class="left-panel">
      <div class="panel-header">
        <span class="title">专家 <span class="count" id="agentCount"></span></span>
        <button class="sm primary" onclick="addAgent()">+ 添加</button>
      </div>
      <div class="agent-list" id="agentList"></div>
    </div>

    <div class="center-panel" id="centerPanel">
      <div class="empty" id="emptyState">
        <div class="empty-icon">&#9881;</div>
        <div class="empty-hint">选择或创建一个专家开始配置</div>
        <button class="sm primary empty-btn" onclick="addAgent()">+ 添加专家</button>
      </div>
      <div id="agentForm" style="display:none">
        <!-- Basic -->
        <div class="sec">
          <div class="sec-head"><span class="sec-icon">&#9998;</span><span class="sec-title">基本信息</span></div>
          <div class="form-grid">
            <div class="form-group"><label>名称</label><input type="text" id="f_name" oninput="onField('name',this.value)"></div>
            <div class="form-group"><label>角色</label><input type="text" id="f_role" oninput="onField('role',this.value)"></div>
            <div class="form-group"><label>描述</label><input type="text" id="f_description" oninput="onField('description',this.value)"></div>
            <div class="form-group"><label>模式</label><select id="f_mode" onchange="onField('mode',this.value)"><option value="subagent">subagent</option><option value="primary">primary</option></select></div>
          </div>
        </div>

        <!-- Config -->
        <div class="sec">
          <div class="sec-head"><span class="sec-icon">&#9881;</span><span class="sec-title">模型配置</span></div>
          <div class="form-grid">
            <div class="form-group"><label>模型</label><select id="f_model" onchange="onConfig('model',this.value)">
              <option value="claude-sonnet-4">Claude Sonnet 4</option>
              <option value="claude-opus-4">Claude Opus 4</option>
              <option value="claude-haiku-4">Claude Haiku 4</option>
              <option value="gpt-4o">GPT-4o</option>
              <option value="gpt-4.1">GPT-4.1</option>
              <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
              <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
              <option value="deepseek-v3">DeepSeek V3</option>
              <option value="deepseek-r1">DeepSeek R1</option>
            </select></div>
            <div class="form-group"><label>颜色</label><div class="color-row"><input type="color" id="f_color" oninput="onColor(this.value)"><span class="color-hex" id="f_colorHex"></span></div></div>
            <div class="form-group"><label>温度</label><input type="number" id="f_temperature" min="0" max="1" step="0.05" oninput="onConfig('temperature',parseFloat(this.value))"></div>
            <div class="form-group"><label>最大步数</label><input type="number" id="f_maxSteps" min="1" max="100" oninput="onConfig('maxSteps',parseInt(this.value))"></div>
          </div>
        </div>

        <!-- Instructions -->
        <div class="sec">
          <div class="sec-head"><span class="sec-icon">&#9997;</span><span class="sec-title">指令</span></div>
          <div id="instructionsList"></div>
          <button class="add-btn" onclick="addInstruction()">+ 添加指令</button>
        </div>

        <!-- Skills -->
        <div class="sec">
          <div class="sec-head"><span class="sec-icon">&#9733;</span><span class="sec-title">技能</span></div>
          <div id="skillsList"></div>
          <button class="add-btn" onclick="addSkill()">+ 添加技能</button>
        </div>

        <!-- Rules -->
        <div class="sec">
          <div class="sec-head"><span class="sec-icon">&#9874;</span><span class="sec-title">规则</span></div>
          <div id="rulesList"></div>
          <button class="add-btn" onclick="addRule()">+ 添加规则</button>
        </div>

        <!-- MCP -->
        <div class="sec">
          <div class="sec-head"><span class="sec-icon">&#9889;</span><span class="sec-title">MCP 服务器</span></div>
          <div id="mcpList"></div>
          <button class="add-btn" onclick="addMcp()">+ 添加 MCP</button>
        </div>
      </div>
    </div>

    <div class="right-panel">
      <div class="right-sec">
        <div class="sec-title">&#128295; 工具</div>
        <div class="tools-grid" id="toolsGrid"></div>
      </div>
      <div class="right-sec">
        <div class="sec-title">&#128274; 权限</div>
        <div id="permsPanel"></div>
      </div>
      <div class="right-sec" style="flex:1;display:flex;flex-direction:column;overflow:hidden">
        <div class="sec-title">&#128196; JSON 预览</div>
        <div class="preview-box" id="previewBox">选择专家查看配置</div>
      </div>
    </div>
  </div>

  <div class="bottom-bar">
    <div><span class="dot ok"></span>AgentTeam 配置工具</div>
    <div id="statusMsg">就绪</div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
const STORAGE_KEY = 'agentteam-config-v2';
const TOOLS = ['read','write','edit','bash','list','grep','glob','todo_write','task','web_search','web_fetch'];
const PERMS = ['skill','edit','bash','webfetch'];
const PERM_VALS = ['allow','ask','deny'];
const COLORS = ['#D4A017','#3fb950','#58a6ff','#f85149','#39d2c0','#bc8cff','#f0883e','#8b949e'];

let state = { teams:{}, activeTeam:null, activeAgentIndex:-1 };
let saveTimer = null;

const PRESETS = {
  research:{team:{name:'research',description:'研究分析团队 — 多 Agent 协作完成从调研到输出的完整工作流',version:'0.1.0',agents:[
    {name:'researcher',role:'高级研究员',description:'负责信息检索和资料收集',mode:'subagent',instructions:['搜索和收集与任务相关的信息','从多个来源交叉验证准确性','整理信息并标注来源'],tools:{read:true,web_search:true,web_fetch:true},agentConfig:{model:'claude-sonnet-4',temperature:0.3,permissions:{web_search:'allow',read:'allow'},color:'#D4A017',maxSteps:20},skills:[{name:'information-retrieval',description:'系统化信息收集',instructions:['从广到窄逐步聚焦','交叉验证信息来源','标注不确定信息']}],rules:[{title:'来源引用',content:['每个结论必须标注来源','使用完整 URL','区分已验证和未验证信息']}],mcpServers:[{name:'web-search',command:['npx','-y','@anthropic/search'],description:'网页搜索'}]},
    {name:'analyst',role:'数据分析师',description:'负责数据清洗、统计分析和模式识别',mode:'subagent',instructions:['审查数据质量和完整性','应用适当的统计方法分析','识别趋势和异常值','用可视化方式呈现结果'],tools:{read:true,write:true,bash:true,grep:true},agentConfig:{model:'gpt-4o',temperature:0.2,permissions:{bash:'allow',write:'allow'},color:'#58a6ff',maxSteps:25},skills:[{name:'data-analysis',description:'数据分析与可视化',instructions:['优先使用 pandas 处理数据','图表需标注数据来源']}],rules:[{title:'数据准确性',content:['所有计算结果需二次验证','标注置信区间']}],mcpServers:[]},
    {name:'writer',role:'报告撰写师',description:'负责撰写研究报告和文档输出',mode:'subagent',instructions:['整合研究和分析结果','撰写结构清晰的报告','确保语言专业且易懂','包含执行摘要和关键结论'],tools:{read:true,write:true,edit:true},agentConfig:{model:'claude-sonnet-4',temperature:0.5,permissions:{write:'allow',edit:'allow'},color:'#3fb950',maxSteps:15},skills:[{name:'report-writing',description:'结构化报告撰写',instructions:['使用标题层级组织内容','每个章节有明确结论']}],rules:[{title:'写作规范',content:['避免口语化表达','数据和结论分开陈述']}],mcpServers:[]}
  ],orchestration:{strategy:'parallel',maxConcurrency:3}},updatedAt:new Date().toISOString()},
  devops:{team:{name:'devops',description:'开发运维团队 — 架构设计 + 编码 + 审查',version:'0.1.0',agents:[
    {name:'architect',role:'架构师',description:'负责系统架构设计和方案评审',mode:'primary',instructions:['评估系统架构合理性','提出优化方案','确保方案满足非功能性需求'],tools:{read:true,grep:true,glob:true,list:true},agentConfig:{model:'claude-opus-4',temperature:0.2,permissions:{read:'allow'},color:'#bc8cff',maxSteps:30},skills:[{name:'architecture-review',description:'架构评审与设计',instructions:['检查模块间耦合度','评估扩展性和可维护性']}],rules:[{title:'架构原则',content:['遵循单一职责原则','组件间松耦合']}],mcpServers:[]},
    {name:'coder',role:'编码工程师',description:'负责代码实现和功能开发',mode:'subagent',instructions:['按照设计方案编写代码','编写单元测试','遵循项目编码规范'],tools:{read:true,write:true,edit:true,bash:true,grep:true,glob:true},agentConfig:{model:'claude-sonnet-4',temperature:0.1,permissions:{write:'allow',edit:'allow',bash:'allow'},color:'#3fb950',maxSteps:40},skills:[{name:'coding',description:'代码实现',instructions:['先写测试再写实现','保持函数短小']}],rules:[{title:'编码规范',content:['变量命名语义化','函数不超过50行']}],mcpServers:[]},
    {name:'reviewer',role:'代码审查员',description:'负责代码审查和质量把控',mode:'subagent',instructions:['审查代码逻辑和边界条件','检查安全漏洞和性能问题','提供改进建议'],tools:{read:true,grep:true,glob:true},agentConfig:{model:'claude-sonnet-4',temperature:0.15,permissions:{read:'allow'},color:'#f85149',maxSteps:25},skills:[{name:'code-review',description:'代码审查',instructions:['关注逻辑正确性','检查错误处理']}],rules:[{title:'审查标准',content:['每个 PR 至少审查关键路径','标记潜在安全风险']}],mcpServers:[]}
  ],orchestration:{strategy:'sequential',maxConcurrency:1}},updatedAt:new Date().toISOString()},
  lite:{team:{name:'lite',description:'轻量级团队 — 探索 + 执行',version:'0.1.0',agents:[
    {name:'scout',role:'代码探索',description:'快速浏览和理解代码库',mode:'subagent',instructions:['快速定位相关代码文件','理解代码结构和依赖','总结关键发现'],tools:{read:true,grep:true,glob:true,list:true},agentConfig:{model:'claude-haiku-4',temperature:0.1,permissions:{read:'allow'},color:'#39d2c0',maxSteps:15},skills:[],rules:[],mcpServers:[]},
    {name:'runner',role:'执行器',description:'执行具体任务和操作',mode:'subagent',instructions:['按指令执行操作','报告执行结果','遇到错误及时反馈'],tools:{read:true,write:true,edit:true,bash:true},agentConfig:{model:'claude-sonnet-4',temperature:0.1,permissions:{write:'allow',edit:'allow',bash:'allow'},color:'#f0883e',maxSteps:30},skills:[],rules:[],mcpServers:[]}
  ],orchestration:{strategy:'sequential',maxConcurrency:1}},updatedAt:new Date().toISOString()}
};

// Persistence
function load(){try{const r=localStorage.getItem(STORAGE_KEY);if(r){state=JSON.parse(r);return}}catch(e){}state={teams:{research:JSON.parse(JSON.stringify(PRESETS.research))},activeTeam:'research',activeAgentIndex:0};save()}
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))},80)}

// Helpers
function tf(){return state.teams[state.activeTeam]}
function ct(){const f=tf();return f?f.team:null}
function ca(){const t=ct();return t?t.agents[state.activeAgentIndex]:null}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function now(){return new Date().toISOString()}
function setStatus(s){document.getElementById('statusMsg').textContent=s}

function toast(msg,type='info'){
  const w=document.getElementById('toastWrap');const d=document.createElement('div');
  d.className='toast '+type;d.textContent=msg;w.appendChild(d);
  setTimeout(()=>{d.style.opacity='0';d.style.transition='opacity .3s';setTimeout(()=>d.remove(),300)},3000);
}

function showCmd(cmd){
  document.querySelectorAll('.cmd-toast').forEach(e=>e.remove());
  const d=document.createElement('div');d.className='cmd-toast';
  d.innerHTML=`<span class="cmd">${esc(cmd)}</span><button class="copy-btn" onclick="copyCmd(this,'${esc(cmd)}')">复制</button>`;
  document.body.appendChild(d);
  setTimeout(()=>{d.style.opacity='0';d.style.transition='opacity .3s';setTimeout(()=>d.remove(),300)},5000);
}
function copyCmd(btn,cmd){navigator.clipboard.writeText(cmd).then(()=>{btn.textContent='已复制';setTimeout(()=>btn.textContent='复制',1500)})}

// Render
function renderAll(){renderTeamBar();renderAgentList();renderCenter();renderRight()}

function renderTeamBar(){
  const sel=document.getElementById('teamSelect');
  sel.innerHTML=Object.keys(state.teams).map(t=>`<option value="${t}" ${t===state.activeTeam?'selected':''}>${t}</option>`).join('');
  const t=ct();
  document.getElementById('teamMeta').textContent=t?`${t.description||''}`:'';
}

function renderAgentList(){
  const el=document.getElementById('agentList');const t=ct();
  document.getElementById('agentCount').textContent=t?`${t.agents.length}`:'0';
  if(!t||!t.agents.length){el.innerHTML='<div class="empty" style="height:auto;padding:30px 10px"><div class="empty-hint">暂无专家</div></div>';return}
  el.innerHTML=t.agents.map((a,i)=>{
    const c=(a.agentConfig&&a.agentConfig.color)||'#8b949e';
    const m=(a.mode==='primary'?'pri':'sub');
    return`<div class="agent-item ${i===state.activeAgentIndex?'active':''}" onclick="selectAgent(${i})">
      <div class="dot" style="color:${c};background:${c}"></div>
      <div class="info"><div class="name">${esc(a.name)}</div><div class="role">${esc(a.role)}</div></div>
      <span class="mode-badge ${m}">${a.mode||'sub'}</span>
      <button class="icon-btn del" onclick="event.stopPropagation();removeAgent(${i})" title="删除">&#10005;</button>
    </div>`
  }).join('');
}

function renderCenter(){
  const a=ca();const form=document.getElementById('agentForm');const empty=document.getElementById('emptyState');
  if(!a){form.style.display='none';empty.style.display='flex';return}
  form.style.display='block';empty.style.display='none';
  document.getElementById('f_name').value=a.name||'';
  document.getElementById('f_role').value=a.role||'';
  document.getElementById('f_mode').value=a.mode||'subagent';
  document.getElementById('f_description').value=a.description||'';
  const cfg=a.agentConfig||{};const color=cfg.color||'#8b949e';
  document.getElementById('f_color').value=color;document.getElementById('f_colorHex').textContent=color;
  document.getElementById('f_model').value=cfg.model||'claude-sonnet-4';
  document.getElementById('f_temperature').value=cfg.temperature!=null?cfg.temperature:0.3;
  document.getElementById('f_maxSteps').value=cfg.maxSteps||20;
  renderInstructions(a);renderSkills(a);renderRules(a);renderMcp(a);
}

function renderInstructions(a){
  document.getElementById('instructionsList').innerHTML=(a.instructions||[]).map((s,i)=>
    `<div class="list-item"><input type="text" value="${esc(s)}" oninput="onInst(${i},this.value)"><button class="icon-btn danger" onclick="rmInst(${i})">&#10005;</button></div>`
  ).join('');
}

function renderSkills(a){
  document.getElementById('skillsList').innerHTML=(a.skills||[]).map((sk,si)=>{
    const insts=(sk.instructions||[]).map((s,ii)=>
      `<div class="list-item"><input type="text" value="${esc(s)}" oninput="onSkInst(${si},${ii},this.value)"><button class="icon-btn danger" onclick="rmSkInst(${si},${ii})">&#10005;</button></div>`
    ).join('');
    return`<div class="card">
      <div class="card-head"><span><span class="card-label">${esc(sk.name||'技能 '+(si+1))}</span><span class="card-sub">${esc(sk.description)}</span></span><button class="sm danger" onclick="rmSkill(${si})">删除</button></div>
      <div class="card-grid"><label>名称</label><input type="text" value="${esc(sk.name)}" oninput="onSkField(${si},'name',this.value)"><label>描述</label><input type="text" value="${esc(sk.description)}" oninput="onSkField(${si},'description',this.value)"></div>
      <div class="card-nested"><div class="nested-label">指令</div>${insts}<button class="add-btn" onclick="addSkInst(${si})">+ 指令</button></div>
    </div>`
  }).join('');
}

function renderRules(a){
  document.getElementById('rulesList').innerHTML=(a.rules||[]).map((r,ri)=>{
    const contents=(r.content||[]).map((c,ci)=>
      `<div class="list-item"><input type="text" value="${esc(c)}" oninput="onRlContent(${ri},${ci},this.value)"><button class="icon-btn danger" onclick="rmRlContent(${ri},${ci})">&#10005;</button></div>`
    ).join('');
    return`<div class="card">
      <div class="card-head"><span class="card-label">${esc(r.title||'规则 '+(ri+1))}</span><button class="sm danger" onclick="rmRule(${ri})">删除</button></div>
      <div class="card-grid"><label>标题</label><input type="text" value="${esc(r.title)}" oninput="onRlField(${ri},'title',this.value)"></div>
      <div class="card-nested"><div class="nested-label">内容</div>${contents}<button class="add-btn" onclick="addRlContent(${ri})">+ 内容</button></div>
    </div>`
  }).join('');
}

function renderMcp(a){
  document.getElementById('mcpList').innerHTML=(a.mcpServers||[]).map((m,mi)=>
    `<div class="card">
      <div class="card-head"><span class="card-label">${esc(m.name||'MCP '+(mi+1))}</span><button class="sm danger" onclick="rmMcp(${mi})">删除</button></div>
      <div class="card-grid"><label>名称</label><input type="text" value="${esc(m.name)}" oninput="onMcpField(${mi},'name',this.value)"><label>命令</label><input type="text" value="${esc((m.command||[]).join(' '))}" oninput="onMcpCmd(${mi},this.value)" placeholder="npx -y @pkg/name"><label>描述</label><input type="text" value="${esc(m.description||'')}" oninput="onMcpField(${mi},'description',this.value)"><label>环境变量</label><input type="text" value="${esc(m.env?Object.entries(m.env).map(([k,v])=>k+'='+v).join(', '):'')}" oninput="onMcpEnv(${mi},this.value)" placeholder="KEY=VAL, KEY2=VAL2"></div>
    </div>`
  ).join('');
}

function renderRight(){
  const a=ca();
  // Tools
  const tools=(a&&a.tools)||{};
  document.getElementById('toolsGrid').innerHTML=TOOLS.map(t=>
    `<label class="tool-chip"><input type="checkbox" ${tools[t]?'checked':''} onchange="onTool('${t}',this.checked)"><span class="tool-name">${t}</span></label>`
  ).join('');
  // Perms
  const perms=(a&&a.agentConfig&&a.agentConfig.permissions)||{};
  document.getElementById('permsPanel').innerHTML=PERMS.map(p=>{
    const v=perms[p]||'ask';
    return`<div class="perm-row"><span class="perm-name">${p}</span><select onchange="onPerm('${p}',this.value)">${PERM_VALS.map(pv=>`<option value="${pv}" ${pv===v?'selected':''}>${pv}</option>`).join('')}</select></div>`
  }).join('');
  // Preview
  renderPreview();
}

function renderPreview(){
  const a=ca();const box=document.getElementById('previewBox');
  if(!a){box.textContent='选择专家查看配置';return}
  box.innerHTML=highlight(JSON.stringify(a,null,2));
}

function highlight(json){
  return json.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"([^"]+)":/g,'<span class="json-key">"$1"</span>:')
    .replace(/: "((?:[^"\\]|\\.)*)"/g,': <span class="json-str">"$1"</span>')
    .replace(/: (true|false)/g,': <span class="json-bool">$1</span>')
    .replace(/: (\d+\.?\d*)/g,': <span class="json-num">$1</span>')
    .replace(/: (null)/g,': <span class="json-null">$1</span>');
}

// Team Actions
document.getElementById('teamSelect').addEventListener('change',function(){state.activeTeam=this.value;state.activeAgentIndex=0;save();renderAll()});
document.getElementById('fileInput').addEventListener('change',function(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=function(ev){
    try{const d=JSON.parse(ev.target.result);if(d.team&&d.team.name){state.teams[d.team.name]=d;state.activeTeam=d.team.name;state.activeAgentIndex=0;save();renderAll();toast('已导入: '+d.team.name,'success')}else toast('无效格式','error')}catch(err){toast('JSON 解析失败','error')}
  };r.readAsText(f);this.value='';
});

function createTeam(){showModal('新建团队',[{key:'name',label:'名称',value:''},{key:'description',label:'描述',value:''}],v=>{
  if(!v.name.trim()){toast('名称不能为空','error');return}
  if(state.teams[v.name]){toast('团队已存在','error');return}
  state.teams[v.name]={team:{name:v.name,description:v.description,version:'0.1.0',agents:[],orchestration:{strategy:'parallel',maxConcurrency:3}},updatedAt:now()};
  state.activeTeam=v.name;state.activeAgentIndex=-1;save();renderAll();toast('已创建: '+v.name,'success')
})}

function renameTeam(){const old=state.activeTeam;if(!old)return;showModal('重命名团队',[{key:'name',label:'新名称',value:old}],v=>{
  if(!v.name.trim()||v.name===old)return;if(state.teams[v.name]){toast('名称已存在','error');return}
  const t=state.teams[old];t.team.name=v.name;state.teams[v.name]=t;delete state.teams[old];state.activeTeam=v.name;save();renderAll();toast('已重命名为: '+v.name,'success')
})}

function deleteTeam(){if(!state.activeTeam)return;if(!confirm('确定删除 "'+state.activeTeam+'"？'))return;
  delete state.teams[state.activeTeam];state.activeTeam=Object.keys(state.teams)[0]||null;state.activeAgentIndex=-1;save();renderAll();toast('已删除','success')}

function loadPreset(){showModal('加载预设团队',[{key:'preset',label:'预设',type:'select',options:Object.keys(PRESETS).map(k=>({value:k,label:k+' — '+PRESETS[k].team.description})),value:'research'}],v=>{
  const p=PRESETS[v.preset];if(!p)return;state.teams[v.preset]=JSON.parse(JSON.stringify(p));state.activeTeam=v.preset;state.activeAgentIndex=0;save();renderAll();toast('已加载: '+v.preset,'success')
})}

function importFile(){document.getElementById('fileInput').click()}
function exportFile(){const f=tf();if(!f){toast('没有可导出的团队','error');return}
  const b=new Blob([JSON.stringify(f,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download=(f.team.name||'team')+'.json';a.click();URL.revokeObjectURL(u);toast('已导出 team.json','success')}

function buildPlugin(){const t=ct();if(!t){toast('请先选择团队','error');return}
  const cmd='bun agent-team build-plugin '+t.name;showCmd(cmd);setStatus(cmd)}

function activateTeam(){const t=ct();if(!t){toast('请先选择团队','error');return}
  const cmd='bun agent-team activate-team '+t.name;showCmd(cmd);setStatus(cmd)}

// Agent Actions
function selectAgent(i){state.activeAgentIndex=i;renderAll();setStatus(ca()?ca().name:'')}
function addAgent(){const t=ct();if(!t){toast('请先选择团队','error');return}
  showModal('添加专家',[{key:'name',label:'名称',value:''},{key:'role',label:'角色',value:''}],v=>{
    if(!v.name.trim()){toast('名称不能为空','error');return}
    t.agents.push({name:v.name,role:v.role||'专家',description:'',mode:'subagent',instructions:[],tools:{},agentConfig:{model:'claude-sonnet-4',temperature:0.3,permissions:{},color:COLORS[t.agents.length%COLORS.length],maxSteps:20},skills:[],rules:[],mcpServers:[]});
    state.activeAgentIndex=t.agents.length-1;save();renderAll();toast('已添加: '+v.name,'success')
  })}
function removeAgent(i){const t=ct();if(!t)return;if(!confirm('删除专家 "'+t.agents[i].name+'"？'))return;
  t.agents.splice(i,1);if(state.activeAgentIndex>=t.agents.length)state.activeAgentIndex=t.agents.length-1;save();renderAll();toast('已删除','success')}

// Field Handlers
function onField(f,v){const a=ca();if(!a)return;a[f]=v;if(f==='name')renderAgentList();save();renderPreview();setStatus(a.name)}
function onColor(v){const a=ca();if(!a)return;if(!a.agentConfig)a.agentConfig={};a.agentConfig.color=v;document.getElementById('f_colorHex').textContent=v;renderAgentList();save();renderPreview()}
function onConfig(f,v){const a=ca();if(!a)return;if(!a.agentConfig)a.agentConfig={};a.agentConfig[f]=v;save();renderPreview()}
function onTool(t,c){const a=ca();if(!a)return;if(!a.tools)a.tools={};a.tools[t]=c;save();renderPreview()}
function onPerm(p,v){const a=ca();if(!a)return;if(!a.agentConfig)a.agentConfig={};if(!a.agentConfig.permissions)a.agentConfig.permissions={};a.agentConfig.permissions[p]=v;save();renderPreview()}

// Instructions
function onInst(i,v){const a=ca();if(!a)return;a.instructions[i]=v;save();renderPreview()}
function addInst(){const a=ca();if(!a)return;if(!a.instructions)a.instructions=[];a.instructions.push('');save();renderInstructions(a);renderPreview()}
function rmInst(i){const a=ca();if(!a)return;a.instructions.splice(i,1);save();renderInstructions(a);renderPreview()}

// Skills
function onSkField(si,f,v){const a=ca();if(!a||!a.skills[si])return;a.skills[si][f]=v;if(f==='name')renderSkills(a);save();renderPreview()}
function onSkInst(si,ii,v){const a=ca();if(!a||!a.skills[si])return;a.skills[si].instructions[ii]=v;save();renderPreview()}
function addSkInst(si){const a=ca();if(!a||!a.skills[si])return;if(!a.skills[si].instructions)a.skills[si].instructions=[];a.skills[si].instructions.push('');save();renderSkills(a);renderPreview()}
function rmSkInst(si,ii){const a=ca();if(!a||!a.skills[si])return;a.skills[si].instructions.splice(ii,1);save();renderSkills(a);renderPreview()}
function addSkill(){const a=ca();if(!a)return;if(!a.skills)a.skills=[];a.skills.push({name:'',description:'',instructions:[]});save();renderSkills(a);renderPreview()}
function rmSkill(si){const a=ca();if(!a)return;a.skills.splice(si,1);save();renderSkills(a);renderPreview()}

// Rules
function onRlField(ri,f,v){const a=ca();if(!a||!a.rules[ri])return;a.rules[ri][f]=v;if(f==='title')renderRules(a);save();renderPreview()}
function onRlContent(ri,ci,v){const a=ca();if(!a||!a.rules[ri])return;a.rules[ri].content[ci]=v;save();renderPreview()}
function addRlContent(ri){const a=ca();if(!a||!a.rules[ri])return;if(!a.rules[ri].content)a.rules[ri].content=[];a.rules[ri].content.push('');save();renderRules(a);renderPreview()}
function rmRlContent(ri,ci){const a=ca();if(!a||!a.rules[ri])return;a.rules[ri].content.splice(ci,1);save();renderRules(a);renderPreview()}
function addRule(){const a=ca();if(!a)return;if(!a.rules)a.rules=[];a.rules.push({title:'',content:[]});save();renderRules(a);renderPreview()}
function rmRule(ri){const a=ca();if(!a)return;a.rules.splice(ri,1);save();renderRules(a);renderPreview()}

// MCP
function onMcpField(mi,f,v){const a=ca();if(!a||!a.mcpServers[mi])return;a.mcpServers[mi][f]=v;if(f==='name')renderMcp(a);save();renderPreview()}
function onMcpCmd(mi,v){const a=ca();if(!a||!a.mcpServers[mi])return;a.mcpServers[mi].command=v.split(/\s+/).filter(Boolean);save();renderPreview()}
function onMcpEnv(mi,v){const a=ca();if(!a||!a.mcpServers[mi])return;if(!v.trim()){delete a.mcpServers[mi].env}else{const e={};v.split(',').forEach(p=>{const[k,...v2]=p.trim().split('=');if(k)e[k]=v2.join('=')});a.mcpServers[mi].env=e}save();renderPreview()}
function addMcp(){const a=ca();if(!a)return;if(!a.mcpServers)a.mcpServers=[];a.mcpServers.push({name:'',command:[],description:''});save();renderMcp(a);renderPreview()}
function rmMcp(mi){const a=ca();if(!a)return;a.mcpServers.splice(mi,1);save();renderMcp(a);renderPreview()}

// Modal
let modalCb=null;
function showModal(title,fields,cb){
  document.querySelectorAll('.modal-overlay').forEach(e=>e.remove());
  modalCb=cb;const o=document.createElement('div');o.className='modal-overlay';
  let h=`<h3>${esc(title)}</h3><div class="modal-grid">`;
  fields.forEach((f,i)=>{
    if(f.type==='select')h+=`<label>${esc(f.label)}</label><select id="mf_${i}">${f.options.map(o=>`<option value="${o.value}" ${o.value===f.value?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`;
    else h+=`<label>${esc(f.label)}</label><input type="text" id="mf_${i}" value="${esc(f.value)}">`
  });
  h+=`</div><div class="modal-actions"><button onclick="closeModal()">取消</button><button class="primary" onclick="confirmModal()">确定</button></div>`;
  const m=document.createElement('div');m.className='modal';m.innerHTML=h;o.appendChild(m);
  o.addEventListener('click',e=>{if(e.target===o)closeModal()});document.body.appendChild(o);
  o.dataset.fields=JSON.stringify(fields);const fi=m.querySelector('input,select');if(fi)setTimeout(()=>fi.focus(),50);
}
function confirmModal(){const o=document.querySelector('.modal-overlay');if(!o||!modalCb)return;
  const fields=JSON.parse(o.dataset.fields);const v={};fields.forEach((f,i)=>{const e=document.getElementById('mf_'+i);v[f.key]=e?e.value:''});modalCb(v);closeModal()}
function closeModal(){document.querySelectorAll('.modal-overlay').forEach(e=>e.remove());modalCb=null}

// Init
load();renderAll();
</script>
